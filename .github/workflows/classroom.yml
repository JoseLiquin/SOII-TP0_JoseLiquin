name: GitHub Classroom Autograding - TP 0

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  evaluacion-autograding:
    name: Autograding Tests
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Permisos de Ejecución
        run: |
          chmod +x test.sh ejercicios.sh

      - name: Ejecutar Suite de Evaluación de TP0
        id: run-tests
        run: |
          ./test.sh

      - name: Reporte de Estado
        if: always()
        run: |
          echo "Evaluación finalizada para el commit ${{ github.sha }}."
